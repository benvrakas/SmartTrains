[AccessTransformers]
; Reads which belt and pipe connections of a cargo platform are inputs, for the migration tool.
Friend=(Class="AFGBuildableTrainPlatformCargo", FriendClass="FSTPlatformAccess")
; Reads a splitter's outputs in the order its sort rules count them, for the migration trace.
Friend=(Class="AFGBuildableConveyorAttachment", FriendClass="FSTPlatformAccess")
; Gives a train a path to a depot signal and reads whether it still has one (depot signals).
Friend=(Class="AFGTrain", FriendClass="FSTPlatformAccess")
